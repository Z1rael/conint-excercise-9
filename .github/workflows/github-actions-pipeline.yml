name: GitHub Actions Pipeline
run-name: ${{github.actor}} pushed to main
on:
  push:
    branches:
      - main


jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node install
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
  Build:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Node install
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
      
  Publish:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build and Push to DockerHub
        uses: MaximilianoBz/dockerhub-buildpush@v1.1
        with:
          registry_url: hub.docker.com
          repository_name: ${{secrets.DOCKERHUB_UN}}/contint9
          user_name: ${{secrets.DOCKERHUB_UN}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
          image_version: ${{ github.sha }}
          
          


          
