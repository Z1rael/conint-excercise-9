name: GitHub Actions Pipeline
run-name: ${{github.actor}} pushed to main
on:
  push:
    branches:
      - main


jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node install
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
  Build:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Node install
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
      
  Publish:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_UN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_UN }}/contInt9

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_UN }}/contint9:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_UN }}/contint9:${{ github.sha }}
          
          


          
